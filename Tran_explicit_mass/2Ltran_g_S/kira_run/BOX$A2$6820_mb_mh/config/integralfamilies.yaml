integralfamilies:
  - name: "BOX$A2$6820"
    loop_momenta: [q1, q2]
    top_level_sectors: [b111001011]
    propagators:
      - ["q1",                mb^2]
      - ["q2",                mh^2]
      - ["q1 - q2",           mb^2]
      - ["-p1 + q1",          0   ]
      - ["-p1 + q2",          0   ]
      - ["-p1 - p2 + q1",     mb^2]
      - ["-p2 + q1 - q2",     0   ]
      - ["-p3 + q1",          0   ]
      - ["-p3 + q2",          mb^2]

