kinematics:
  incoming_momenta: [p1, p2]
  outgoing_momenta: [p3, p4]
  momentum_conservation: [p4, +p1+p2-p3]
  kinematic_invariants:
     - [s,  2]
     - [t,  2]
     - [mw,  1]
     - [mb,  1]
     - [mt,  1]
  scalarproduct_rules:
     - [[p1, p1], 0]
     - [[p2, p2], 0]
     - [[p3, p3], 43681/2500]
     - [[p4, p4], 43681/2500]
     - [[p1 + p2, p1 + p2], s]
     - [[p1 - p3, p1 - p3], t]
     - [[p1 - p4, p1 - p4], 43681/1250 - s - t]
